name: Build Custom FFmpeg Windows Static

on:
  workflow_dispatch:

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gfortran-mingw-w64-x86-64 \
            pkg-config \
            cmake \
            ninja-build \
            meson \
            nasm \
            yasm \
            autoconf \
            automake \
            libtool \
            git \
            subversion \
            mercurial \
            p7zip-full \
            curl \
            wget \
            python3-pip

      - name: Clone FFmpeg Windows Build Helpers
        run: |
          git clone https://github.com/rdp/ffmpeg-windows-build-helpers.git
          cd ffmpeg-windows-build-helpers

      - name: Build Static FFmpeg with Custom Encoders
        run: |
          cd ffmpeg-windows-build-helpers
          
          # Konfigurasi opsi compile custom
          ./cross_compile_ffmpeg.sh \
            --build-ffmpeg-static=y \
            --compiler-flavors=win64 \
            --enable-gpl=y \
            --custom-hangover="--enable-nonfree --enable-gpl --enable-version3 --enable-libfdk-aac --enable-libavif --enable-libwebp --enable-libvvenc --extra-cflags=-static --extra-ldflags=-static"

      - name: Locate and Collect Binaries
        run: |
          mkdir -p output
          # Mencari file exe hasil kompilasi
          find ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git* -name "ffmpeg.exe" -exec cp {} output/ \; 2>/dev/null || true
          find ffmpeg-windows-build-helpers/sandbox/win64/ffmpeg_git* -name "ffprobe.exe" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload FFmpeg Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-static-custom
          path: output/*.exe
