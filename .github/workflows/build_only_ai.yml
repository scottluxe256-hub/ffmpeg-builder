name: Build Custom FFmpeg Windows Static (v9.0.1 / Latest)

on:
  workflow_dispatch:

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & MinGW Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            mingw-w64 \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gfortran-mingw-w64-x86-64 \
            pkg-config \
            cmake \
            ninja-build \
            meson \
            nasm \
            yasm \
            autoconf \
            automake \
            libtool \
            git \
            subversion \
            mercurial \
            p7zip-full \
            curl \
            wget \
            python3-pip

      - name: Clone FFmpeg Windows Build Helpers
        run: |
          git clone https://github.com/rdp/ffmpeg-windows-build-helpers.git

      - name: Build Static FFmpeg with Custom Encoders
        run: |
          cd ffmpeg-windows-build-helpers
          
          # Flag --git-get-latest=y akan selalu menarik update source code git terbaru (v9.0.1+)
          ./cross_compile_ffmpeg.sh \
            --compiler-flavors=win64 \
            --build-ffmpeg-static=y \
            --git-get-latest=y \
            --enable-gpl=y \
            --enable-nonfree=y \
            --extra-ffmpeg-options="--enable-libfdk-aac --enable-libavif --enable-libwebp --enable-libvvenc"

      - name: Locate and Collect Binaries
        run: |
          mkdir -p output
          find ffmpeg-windows-build-helpers/sandbox -name "ffmpeg.exe" -exec cp {} output/ \; 2>/dev/null || true
          find ffmpeg-windows-build-helpers/sandbox -name "ffprobe.exe" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload FFmpeg Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-static-v9.0.1
          path: output/*.exe
