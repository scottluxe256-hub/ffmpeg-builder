name: Build FFmpeg Static Zip

on:
  workflow_dispatch:

jobs:
  build-android-static:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      NDK_VERSION: r26b
      INSTALL_DIR: ${{ github.workspace }}/build_assets
      API: "29"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            git yasm nasm cmake ninja-build wget unzip python3 meson zip binutils

      - name: Download Android NDK r26b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip -O ndk.zip
          unzip -o -q ndk.zip
          echo "NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r26b" >> "$GITHUB_ENV"

      - name: Build 14 External Libraries
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          SRC="$ROOT/build_sources"
          PREFIX="$INSTALL_DIR"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
          HOST="aarch64-linux-android"

          mkdir -p "$SRC" "$PREFIX/include" "$PREFIX/lib/pkgconfig"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export AS="$CC"

          export CFLAGS="-O3 -fPIC -march=armv8-a+simd+crypto -ftree-vectorize"
          export CXXFLAGS="$CFLAGS"
          export CPPFLAGS="-I$PREFIX/include"
          export LDFLAGS="-L$PREFIX/lib"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          clone() { git clone --depth 1 "$1" "$2"; }
          cmake_android() {
            cmake -S "$1" -B "$2" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-${API} \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib "${@:3}"
          }

          # 1. zlib
          clone https://github.com/madler/zlib.git "$SRC/zlib"
          cmake_android "$SRC/zlib" "$SRC/zlib-b"
          cmake --build "$SRC/zlib-b" && cmake --install "$SRC/zlib-b"

          # 2. ogg
          clone https://github.com/xiph/ogg.git "$SRC/ogg"
          cmake_android "$SRC/ogg" "$SRC/ogg-b"
          cmake --build "$SRC/ogg-b" && cmake --install "$SRC/ogg-b"

          # 3. libpng
          clone https://github.com/pnggroup/libpng.git "$SRC/libpng"
          cmake_android "$SRC/libpng" "$SRC/libpng-b" -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF -DPNG_EXECUTABLES=OFF -DPNG_ARM_NEON=on
          cmake --build "$SRC/libpng-b" && cmake --install "$SRC/libpng-b"

          # 4. zimg
          clone https://github.com/sekrit-twc/zimg.git "$SRC/zimg"
          cd "$SRC/zimg" && git submodule update --init --recursive && ./autogen.sh
          ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared LDFLAGS="$LDFLAGS"
          make -j$(nproc) && make install

          # 5. x264
          clone https://code.videolan.org/videolan/x264.git "$SRC/x264"
          cd "$SRC/x264"
          ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-cli --enable-pic --enable-asm
          make -j$(nproc) && make install

          # 6. x265
          clone https://github.com/videolan/x265.git "$SRC/x265"
          cmake_android "$SRC/x265/source" "$SRC/x265-b" \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DENABLE_ASSEMBLY=OFF
          cmake --build "$SRC/x265-b" && cmake --install "$SRC/x265-b"
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: x265\nDescription: H.265/HEVC video encoder\nVersion: 3.5\nLibs: -L\${libdir} -lx265\nLibs.private: -lc++_static -lc++abi -lm -ldl -pthread\nCflags: -I\${includedir}\n" "$PREFIX" > "$PREFIX/lib/pkgconfig/x265.pc"

          # 7. SVT-AV1
          clone https://gitlab.com/AOMediaCodec/SVT-AV1.git "$SRC/SVT-AV1"
          cmake_android "$SRC/SVT-AV1" "$SRC/SVT-AV1-b" -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF
          cmake --build "$SRC/SVT-AV1-b" && cmake --install "$SRC/SVT-AV1-b"

          # 8. libaom
          clone https://aomedia.googlesource.com/aom "$SRC/aom"
          cmake_android "$SRC/aom" "$SRC/aom-b" -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TOOLS=OFF -DENABLE_NEON=ON
          cmake --build "$SRC/aom-b" && cmake --install "$SRC/aom-b"
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: aom\nDescription: AV1 Video Codec Library\nVersion: 3.8.0\nLibs: -L\${libdir} -laom\nLibs.private: -lc++_static -lc++abi -lm -ldl -pthread\nCflags: -I\${includedir}\n" "$PREFIX" > "$PREFIX/lib/pkgconfig/aom.pc"

          # 9. libvpx
          clone https://chromium.googlesource.com/webm/libvpx.git "$SRC/libvpx"
          mkdir -p "$SRC/libvpx-b" && cd "$SRC/libvpx-b"
          ../libvpx/configure --target=arm64-android-gcc --prefix="$PREFIX" --disable-shared --enable-static --disable-examples --enable-pic
          make -j$(nproc) && make install

          # 10. mp3lame
          clone https://github.com/lameproject/lame.git "$SRC/lame"
          cd "$SRC/lame"
          ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared --disable-frontend LDFLAGS="$LDFLAGS"
          make -j$(nproc) && make install

          # 11. opus
          clone https://github.com/xiph/opus.git "$SRC/opus"
          cmake_android "$SRC/opus" "$SRC/opus-b" -DOPUS_BUILD_SHARED_LIBRARY=OFF -DOPUS_INSTALL_PKG_CONFIG_MODULE=ON
          cmake --build "$SRC/opus-b" && cmake --install "$SRC/opus-b"

          # 12. vorbis
          clone https://github.com/xiph/vorbis.git "$SRC/vorbis"
          cd "$SRC/vorbis" && ./autogen.sh
          ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared OGG_CFLAGS="-I$PREFIX/include" OGG_LIBS="-L$PREFIX/lib -logg" LDFLAGS="$LDFLAGS"
          make -j$(nproc) && make install

          # 13. webp
          clone https://chromium.googlesource.com/webm/libwebp.git "$SRC/libwebp"
          cmake_android "$SRC/libwebp" "$SRC/libwebp-b" -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF -DWEBP_ENABLE_SIMD=ON
          cmake --build "$SRC/libwebp-b" && cmake --install "$SRC/libwebp-b"
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: libwebp\nDescription: WebP image codec\nVersion: 1.3.2\nLibs: -L\${libdir} -lwebp -lsharpyuv\nLibs.private: -lm -pthread\nCflags: -I\${includedir}\n" "$PREFIX" > "$PREFIX/lib/pkgconfig/libwebp.pc"

          # 14. fdk-aac
          clone https://github.com/mstorsjo/fdk-aac.git "$SRC/fdk-aac"
          cd "$SRC/fdk-aac" && ./autogen.sh
          ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared LDFLAGS="$LDFLAGS"
          make -j$(nproc) && make install

      - name: Build FFmpeg Binaries (v9.0.1)
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PREFIX="$INSTALL_DIR"
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"

          cd "$ROOT"
          wget -q "https://ffmpeg.org/releases/ffmpeg-9.0.1.tar.xz"
          tar -xJf ffmpeg-9.0.1.tar.xz

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          FLAGS=(
            --target-os=android
            --arch=aarch64
            --cpu=armv8-a
            --enable-cross-compile
            --cc="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang"
            --cxx="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++"
            --ar="$TOOLCHAIN/bin/llvm-ar"
            --strip="$TOOLCHAIN/bin/llvm-strip"
            --pkg-config=pkg-config
            --pkg-config-flags="--static"
            --extra-cflags="-I$PREFIX/include -O3 -fPIC -march=armv8-a+simd+crypto"
            --extra-cxxflags="-I$PREFIX/include -O3 -fPIC -march=armv8-a+simd+crypto"
            --extra-ldflags="-L$PREFIX/lib"
            --extra-libs="-lc++_static -lc++abi -lm -ldl -lz -llog -landroid -pthread"
            --enable-static
            --disable-shared
            --disable-doc
            --enable-asm
            --enable-neon
            --enable-zlib
            --enable-libzimg
            --enable-libx264
            --enable-libx265
            --enable-libsvtav1
            --enable-libaom
            --enable-libvpx
            --enable-libmp3lame
            --enable-libopus
            --enable-libvorbis
            --enable-libwebp
            --enable-jni
            --enable-mediacodec
          )

          # --- Build GPL Version ---
          cp -r ffmpeg-9.0.1 ffmpeg-gpl && cd ffmpeg-gpl
          ./configure "${FLAGS[@]}" --enable-gpl

          make -j$(nproc)
          mkdir -p "$ROOT/dist/gpl"
          cp ffmpeg "$ROOT/dist/gpl/ffmpeg-gpl"

          # --- Build Nonfree Version ---
          cd "$ROOT"
          cp -r ffmpeg-9.0.1 ffmpeg-nonfree && cd ffmpeg-nonfree
          ./configure "${FLAGS[@]}" --enable-gpl --enable-nonfree --enable-libfdk-aac

          make -j$(nproc)
          mkdir -p "$ROOT/dist/nonfree"
          cp ffmpeg "$ROOT/dist/nonfree/ffmpeg-nonfree"

          # Packing ke ZIP
          cd "$ROOT/dist"
          zip -j ffmpeg-android-arm64-binaries.zip gpl/ffmpeg-gpl nonfree/ffmpeg-nonfree

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-binaries-zip
          path: ${{ github.workspace }}/dist/*
          if-no-files-found: error
