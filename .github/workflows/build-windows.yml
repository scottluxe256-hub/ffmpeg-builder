name: Build FFmpeg Modular Shared Library (.dll) Windows x64

on:
  workflow_dispatch:

jobs:
  build-windows-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK (For jni.h Header)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Maximize RAM Disk Build Space
        run: |
          sudo mkdir -p /dev/shm/build_space
          sudo chown -R $USER:$USER /dev/shm/build_space
          echo "WORKSPACE=/dev/shm/build_space" >> $GITHUB_ENV

      - name: Install MinGW-w64 & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            git yasm nasm texinfo cmake ninja-build wget unzip meson curl \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools mingw-w64-x86-64-dev

      - name: Setup Windows MinGW Environment Variables
        run: |
          INSTALL_DIR="$WORKSPACE/build_assets_win64"
          mkdir -p "$INSTALL_DIR/lib" "$INSTALL_DIR/include" "$INSTALL_DIR/lib/pkgconfig"
          mkdir -p $GITHUB_WORKSPACE/output_win64

          echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$INSTALL_DIR/lib/pkgconfig" >> $GITHUB_ENV
          echo "JOBS=$(nproc)" >> $GITHUB_ENV

          echo "TARGET_CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          echo "TARGET_CXX=x86_64-w64-mingw32-g++" >> $GITHUB_ENV
          echo "AR=x86_64-w64-mingw32-ar" >> $GITHUB_ENV
          echo "RANLIB=x86_64-w64-mingw32-ranlib" >> $GITHUB_ENV
          echo "STRIP=x86_64-w64-mingw32-strip" >> $GITHUB_ENV

      # Cache Static Libraries & Dynamic Plugins
      - name: Cache Compiled Dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            /dev/shm/build_space/build_assets_win64
            output_win64/libfdk_aac.dll
          key: win64-deps-v4-${{ hashFiles('.github/workflows/build-windows.yml') }}

      # 1. BUILD LIBFDK-AAC STANDALONE PLUGIN (.DLL)
      - name: Build Standalone Plugin libfdk_aac.dll
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          ./autogen.sh
          export CC=$TARGET_CC
          export CXX=$TARGET_CXX
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --host=x86_64-w64-mingw32 --prefix=$INSTALL_DIR --enable-shared --disable-static
          make -j$JOBS
          $STRIP .libs/libfdk-aac-2.dll || $STRIP .libs/libfdk-aac*.dll
          cp .libs/libfdk-aac*.dll $GITHUB_WORKSPACE/output_win64/libfdk_aac.dll

      # 2. BUILD OPUS STATIC (WIN64)
      - name: Build libopus
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus
          ./autogen.sh
          export CC=$TARGET_CC
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --host=x86_64-w64-mingw32 --prefix=$INSTALL_DIR --enable-static --disable-shared
          make -j$JOBS && make install

      # 3. BUILD X264 STATIC (WIN64)
      - name: Build x264
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          export CC=$TARGET_CC
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --host=x86_64-w64-mingw32 --prefix=$INSTALL_DIR --enable-static --disable-cli
          make -j$JOBS && make install

      # 4. BUILD X265 STATIC (WIN64)
      - name: Build x265
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git x265
          
          # Hapus folder .git agar CMake tidak bingung saat shallow clone
          rm -rf x265/.git
          echo "3.5" > x265/source/VERSION

          cat << 'EOF' > $WORKSPACE/mingw_toolchain.cmake
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF

          cmake -G "Ninja" -S x265/source -B x265/build \
            -DCMAKE_TOOLCHAIN_FILE=$WORKSPACE/mingw_toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DEXPORT_C_API=ON \
            -DENABLE_ASSEMBLY=ON \
            -DNO_ATOMICS=OFF
          
          ninja -C x265/build install

          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: x265\nDescription: H.265/HEVC video encoder\nVersion: 3.5\nLibs: -L\${libdir} -lx265 -lstdc++ -lm\nCflags: -I\${includedir}\n" "$INSTALL_DIR" > $INSTALL_DIR/lib/pkgconfig/x265.pc

      # 5. BUILD SVT-AV1 STATIC (WIN64)
      - name: Build SVT-AV1
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -G "Ninja" -S SVT-AV1 -B SVT-AV1/build \
            -DCMAKE_TOOLCHAIN_FILE=$WORKSPACE/mingw_toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF
          ninja -C SVT-AV1/build install

      # 6. BUILD LIBVPX STATIC (VP8 / VP9 WIN64)
      - name: Build libvpx
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://chromium.googlesource.com/webm/libvpx.git
          cd libvpx
          export CC=$TARGET_CC
          export CXX=$TARGET_CXX
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --target=x86_64-win64-gcc --prefix=$INSTALL_DIR \
            --enable-pic --disable-examples --disable-unit-tests --enable-vp8 --enable-vp9 \
            --disable-shared --enable-static
          make -j$JOBS && make install

      # 7. BUILD FFMPEG STATIC LGPL (WIN64)
      - name: Build FFmpeg Static Libraries
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg_source
          cd ffmpeg_source

          ./configure \
            --target-os=mingw32 --arch=x86_64 --enable-cross-compile \
            --cross-prefix=x86_64-w64-mingw32- \
            --cc=$TARGET_CC \
            --cxx=$TARGET_CXX \
            --ar=$AR \
            --ranlib=$RANLIB \
            --strip=$STRIP \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --extra-cflags="-I$INSTALL_DIR/include" \
            --extra-ldflags="-L$INSTALL_DIR/lib" \
            --prefix=$INSTALL_DIR \
            --enable-static --disable-shared \
            --enable-gpl --disable-nonfree \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libvpx --enable-libopus \
          || { echo "----- ffbuild/config.log -----"; tail -n 300 ffbuild/config.log; exit 1; }

          make -j$JOBS install

      # 8. BUNDLE ALL STATIC LIBRARIES INTO SINGLE FFMPEG.DLL (JNI SHARED)
      - name: Bundle into Single ffmpeg.dll
        run: |
          echo "Menggabungkan SEMUA static libraries jadi satu ffmpeg.dll..."
          
          $TARGET_CC -shared -o $GITHUB_WORKSPACE/output_win64/ffmpeg.dll \
            $GITHUB_WORKSPACE/jni/ffmpeg_win_jni.c \
            -I$JAVA_HOME/include \
            -I$JAVA_HOME/include/linux \
            -I$JAVA_HOME/include/win32 \
            -I$INSTALL_DIR/include \
            -Wl,--whole-archive \
            $INSTALL_DIR/lib/libavformat.a \
            $INSTALL_DIR/lib/libavcodec.a \
            $INSTALL_DIR/lib/libavutil.a \
            $INSTALL_DIR/lib/libswresample.a \
            $INSTALL_DIR/lib/libx264.a \
            $INSTALL_DIR/lib/libx265.a \
            $INSTALL_DIR/lib/libSvtAv1Enc.a \
            $INSTALL_DIR/lib/libvpx.a \
            $INSTALL_DIR/lib/libopus.a \
            -Wl,--no-whole-archive \
            $INSTALL_DIR/lib/libavfilter.a \
            $INSTALL_DIR/lib/libswscale.a \
            -L$INSTALL_DIR/lib \
            -lstdc++ -lwinpthread -lwinmm -lws2_32 -lbcrypt -lole32 -luser32 -lcrypt32 -lncrypt -lsecur32 -lmfuuid

          $STRIP $GITHUB_WORKSPACE/output_win64/ffmpeg.dll

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x64-binaries
          path: output_win64/*
