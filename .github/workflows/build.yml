name: Build Full FFmpeg Static Android ARM64 + LCEVC + FDK-AAC (Fresh Master)

on:
  workflow_dispatch:

jobs:
  build-android-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            git yasm nasm texinfo cmake ninja-build wget unzip meson

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r26b
          key: ${{ runner.os }}-ndk-r26b

      - name: Setup Environment & Android NDK r26b
        run: |
          # Perbaikan Logika: Jika cache tidak ditemukan, unduh DAN ekstrak NDK-nya
          if [ "${{ steps.cache-ndk.outputs.cache-hit }}" != 'true' ]; then
            echo "Cache NDK tidak ditemukan. Memulai proses unduhan..."
            wget -q https://google.com
            echo "Mengunduh selesai. Memulai ekstraksi..."
            unzip -q android-ndk-r26b-linux.zip
            echo "Ekstraksi selesai."
          else
            echo "Cache NDK ditemukan! Melewati proses unduhan dan ekstraksi."
          fi

          INSTALL_DIR="$GITHUB_WORKSPACE/build_assets_aarch64"

          echo "NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r26b" >> $GITHUB_ENV
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$INSTALL_DIR/lib/pkgconfig:$INSTALL_DIR/lib64/pkgconfig" >> $GITHUB_ENV

          # Set khusus ARM64 Clang Compiler
          echo "TARGET_CLANG=$GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
          echo "TARGET_CXX=$GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" >> $GITHUB_ENV
          echo "CROSS_PREFIX=aarch64-linux-android-" >> $GITHUB_ENV

          # Wrapper symlinks ARM64
          mkdir -p $GITHUB_WORKSPACE/bin_wrapper_aarch64
          cd $GITHUB_WORKSPACE/bin_wrapper_aarch64
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar aarch64-linux-android-ar || true
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-as aarch64-linux-android-as || true
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ld aarch64-linux-android-ld || true
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm aarch64-linux-android-nm || true
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib aarch64-linux-android-ranlib || true
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip aarch64-linux-android-strip || true
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings aarch64-linux-android-strings || true
          
          echo "$GITHUB_WORKSPACE/bin_wrapper_aarch64" >> $GITHUB_PATH

      - name: Build LCEVC Integration Layer (EIL)
        run: |
          git clone --depth 1 https://github.com
          cd lcevc-eil
          mkdir build && cd build
          cmake -G "Ninja" .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF
          ninja install

      - name: Build libfdk-aac (Master)
        run: |
          git clone --depth 1 https://github.com
          cd fdk-aac && ./autogen.sh
          export CC=$TARGET_CLANG
          export CXX=$TARGET_CXX
          ./configure --host=aarch64-linux-android --prefix=$INSTALL_DIR --enable-static --disable-shared
          make -j$(nproc) && make install

      - name: Build libopus (Master)
        run: |
          git clone --depth 1 https://github.com
          cd opus && ./autogen.sh
          export CC=$TARGET_CLANG
          ./configure --host=aarch64-linux-android --prefix=$INSTALL_DIR --enable-static --disable-shared
          make -j$(nproc) && make install

      - name: Build x264 (Master)
        run: |
          git clone --depth 1 https://videolan.org
          cd x264
          export CC=$TARGET_CLANG
          ./configure --host=aarch64-linux-android --cross-prefix=$CROSS_PREFIX \
            --prefix=$INSTALL_DIR --enable-static --enable-pic --disable-cli --sysroot=$TOOLCHAIN/sysroot
          make -j$(nproc) && make install

      - name: Build x265 (Master)
        run: |
          git clone --depth 1 https://github.com
          cmake -G "Ninja" -S x265/source -B x265/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DEXPORT_C_API=ON \
            -DENABLE_ASSEMBLY=OFF
          ninja -C x265/build install

          mkdir -p $INSTALL_DIR/lib/pkgconfig
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: x265\nDescription: H.265/HEVC video encoder\nVersion: 4.3\nLibs: -L\${libdir} -lx265 -lc++_static -lc++abi -lm\nCflags: -I\${includedir}\n" "$INSTALL_DIR" > $INSTALL_DIR/lib/pkgconfig/x265.pc

      - name: Build SVT-AV1 (Fresh Master)
        run: |
          git clone --depth 1 https://gitlab.com
          cmake -G "Ninja" -S SVT-AV1 -B SVT-AV1/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF
          ninja -C SVT-AV1/build install

      - name: Build libvpx (Master)
        run: |
          git clone --depth 1 https://googlesource.com
          cd libvpx
          export CC=$TARGET_CLANG
          export CXX=$TARGET_CXX
          ./configure --target=arm64-android-gcc --prefix=$INSTALL_DIR \
            --enable-pic --disable-examples --disable-unit-tests --enable-vp8 --enable-vp9 \
            --disable-shared --enable-static --as=yasm
          make -j$(nproc) && make install

      - name: Build FFmpeg (Fresh Master ARM64)
        run: |
          mkdir ffmpeg_source && cd ffmpeg_source
          git init -q
          git remote add origin https://github.com
          git fetch --depth 1 origin master
          git checkout -q FETCH_HEAD

          ./configure \
            --target-os=android --arch=aarch64 --cpu=armv8-a --enable-cross-compile \
            --cc=$TARGET_CLANG \
            --cxx=$TARGET_CXX \
            --ar=aarch64-linux-android-ar \
            --ranlib=aarch64-linux-android-ranlib \
            --strip=aarch64-linux-android-strip \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --extra-cflags="-I$INSTALL_DIR/include -fPIC" \
            --extra-cxxflags="-I$INSTALL_DIR/include -fPIC" \
            --extra-ldflags="-L$INSTALL_DIR/lib -L$INSTALL_DIR/lib64" \
            --extra-libs="-lc++_static -lc++abi -lm -ldl -lz -llog -landroid -pthread" \
            --prefix=$INSTALL_DIR \
            --enable-static --disable-shared \
            --enable-gpl --enable-nonfree \
            --enable-jni --enable-mediacodec \
            --enable-liblcevc_sei \
            --enable-libfdk-aac --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libvpx --enable-libopus \
          || { echo "----- ffbuild/config.log (300 baris terakhir) -----"; tail -n 300 ffbuild/config.log; exit 1; }

          make -j$(nproc)
          $TOOLCHAIN/bin/llvm-strip ffmpeg

      - name: Verify Binary Dependencies
        run: |
          cd ffmpeg_source
          file ffmpeg
          echo "---- NEEDED shared libraries ----"
          $TOOLCHAIN/bin/llvm-readelf -d ffmpeg | grep -E "NEEDED|SONAME" || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64-lcevc-master-fresh
          path: ffmpeg_source/ffmpeg
