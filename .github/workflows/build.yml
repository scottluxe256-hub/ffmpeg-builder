name: Build FFmpeg Static Android ARM64

on:
  workflow_dispatch:

jobs:
  build-android-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            git yasm nasm texinfo cmake ninja-build wget unzip

      - name: Setup Android NDK r26b & Symlink Wrapper
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q android-ndk-r26b-linux.zip
          echo "NDK_PATH=$GITHUB_WORKSPACE/android-ndk-r26b" >> $GITHUB_ENV
          echo "TOOLCHAIN=$GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "INSTALL_DIR=$GITHUB_WORKSPACE/build_assets" >> $GITHUB_ENV
          
          # Membuat folder wrapper agar ./configure tidak error mencari file nama lama
          mkdir -p $GITHUB_WORKSPACE/bin_wrapper
          cd $GITHUB_WORKSPACE/bin_wrapper
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar aarch64-linux-android-ar
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-as aarch64-linux-android-as
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ld aarch64-linux-android-ld
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm aarch64-linux-android-nm
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib aarch64-linux-android-ranlib
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip aarch64-linux-android-strip
          ln -s $GITHUB_WORKSPACE/android-ndk-r26b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings aarch64-linux-android-strings
          echo "$GITHUB_WORKSPACE/bin_wrapper" >> $GITHUB_PATH

      # --- LIBRARIES ---

      - name: Build libfdk-aac
        run: |
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac
          cd fdk-aac
          ./autogen.sh
          export CC=$TOOLCHAIN/bin/aarch64-linux-android29-clang
          ./configure --host=aarch64-linux-android --prefix=$INSTALL_DIR --enable-static --disable-shared
          make -j$(nproc) && make install

      - name: Build x264
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          export CC=$TOOLCHAIN/bin/aarch64-linux-android29-clang
          ./configure --host=aarch64-linux-android --cross-prefix=aarch64-linux-android- \
            --prefix=$INSTALL_DIR --enable-static --enable-pic --disable-cli --sysroot=$TOOLCHAIN/sysroot
          make -j$(nproc) && make install

      - name: Build x265
        run: |
          git clone https://github.com/videolan/x265.git
          cd x265/source
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=29 -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$NDK_PATH \
            -DCMAKE_C_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android29-clang \
            -DCMAKE_CXX_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android29-clang++ \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DEXPORT_C_API=ON
          make -j$(nproc) && make install

      - name: Build SVT-AV1
        run: |
          git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1
          mkdir build && cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_VERSION=29 -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DCMAKE_ANDROID_NDK=$NDK_PATH \
            -DCMAKE_C_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android29-clang \
            -DCMAKE_CXX_COMPILER=$TOOLCHAIN/bin/aarch64-linux-android29-clang++ \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF
          make -j$(nproc) && make install

      # --- FFMPEG ---

      - name: Build FFmpeg
        run: |
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg_source
          cd ffmpeg_source
          export PKG_CONFIG_PATH="$INSTALL_DIR/lib/pkgconfig"
          
          ./configure \
            --target-os=android --arch=aarch64 --cpu=armv8-a --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android29-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android29-clang++ \
            --ar=aarch64-linux-android-ar \
            --ranlib=aarch64-linux-android-ranlib \
            --strip=aarch64-linux-android-strip \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --extra-cflags="-I$INSTALL_DIR/include -fPIC" \
            --extra-ldflags="-L$INSTALL_DIR/lib -static -static-libstdc++ -static-libgcc -Wl,-Bstatic" \
            --extra-libs="-lm -ldl -lz -lpthread" \
            --prefix=$INSTALL_DIR \
            --enable-static --disable-shared \
            --enable-gpl --enable-nonfree \
            --enable-jni --enable-mediacodec \
            --enable-libfdk-aac --enable-libx264 --enable-libx265 --enable-libsvtav1
          make -j$(nproc)
          $TOOLCHAIN/bin/llvm-strip ffmpeg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-monolithic
          path: ffmpeg_source/ffmpeg
