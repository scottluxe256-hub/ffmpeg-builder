name: Build FFmpeg Master Universal Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FFmpeg Builds Repo
        uses: actions/checkout@v4
        with:
          repository: BtbN/FFmpeg-Builds
          ref: master

      - name: Build Custom FFmpeg via Docker
        run: |
          # 1. Build image Docker pembuat FFmpeg
          docker build -t ffmpeg-builder ./docker

          # 2. Jalankan kompilasi FFmpeg Windows 64-bit GPL (termasuk fdk-aac, x264, x265, svt-av1, QSV, NVENC, AMF)
          docker run --rm -v ${{ github.workspace }}:/workspace ffmpeg-builder \
            /workspace/build.sh target=win64 variant=gpl-shared-custom

      - name: Upload FFmpeg Master Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFmpeg-Master-Universal-Windows
          path: artifacts/*.zip
          
