name: Build Fresh FFmpeg Master Complete for Android (aarch64)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Install Build Tools & Rust Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build autoconf automake libtool \
            pkg-config git curl wget unzip python3 yasm nasm texinfo gawk
          
          rustup target add aarch64-linux-android
          cargo install cargo-ndk

      # Menggunakan NDK bawaan runner Ubuntu GitHub (Gak perlu download/action luar!)
      - name: Locate Pre-installed Android NDK
        run: |
          # Cari folder NDK yang sudah terinstall otomatis di runner
          NDK_FOUND=$(ls -d $ANDROID_SDK_ROOT/ndk/* | tail -n 1)
          echo "NDK_PATH=$NDK_FOUND" >> $GITHUB_ENV
          echo "Target NDK Path: $NDK_FOUND"

      - name: Setup Toolchain & Directories
        run: |
          echo "TARGET_API=29" >> $GITHUB_ENV
          echo "BUILD_DIR=$GITHUB_WORKSPACE/build_space" >> $GITHUB_ENV
          echo "PREFIX_GPL=$GITHUB_WORKSPACE/dist/gpl" >> $GITHUB_ENV
          echo "PREFIX_NONFREE=$GITHUB_WORKSPACE/dist/nonfree" >> $GITHUB_ENV

      # -------------------------------------------------------------
      # COMPILE ALL EXTERNAL LIBRARIES
      # -------------------------------------------------------------
      - name: Build All External Libraries
        run: |
          mkdir -p $BUILD_DIR $PREFIX_GPL $PREFIX_NONFREE
          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android29-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android29-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export CFLAGS="-O3 -ftree-vectorize -flto -march=armv8-a+simd+crypto -fPIC"
          export LDFLAGS="-flto -Wl,--gc-sections"

          install_libs() {
            cp -r $1/include/* $PREFIX_GPL/include/ 2>/dev/null || true
            cp -r $1/lib/* $PREFIX_GPL/lib/ 2>/dev/null || true
            cp -r $1/include/* $PREFIX_NONFREE/include/ 2>/dev/null || true
            cp -r $1/lib/* $PREFIX_NONFREE/lib/ 2>/dev/null || true
          }

          cd $BUILD_DIR

          # 1. zlib
          git clone --depth 1 https://github.com/madler/zlib.git
          cd zlib
          ./configure --prefix=$BUILD_DIR/out_zlib --static
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_zlib
          cd $BUILD_DIR

          # 2. libogg
          git clone --depth 1 https://github.com/xiph/ogg.git
          cd ogg
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_ogg
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_ogg
          cd $BUILD_DIR

          # 3. libflac
          git clone --depth 1 https://github.com/xiph/flac.git
          cd flac
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_flac --with-ogg=$BUILD_DIR/out_ogg
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_flac
          cd $BUILD_DIR

          # 4. libpng
          git clone --depth 1 https://github.com/pnggroup/libpng.git
          cd libpng
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_png CPPFLAGS="-I$PREFIX_GPL/include" LDFLAGS="-L$PREFIX_GPL/lib"
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_png
          cd $BUILD_DIR

          # 5. libzimg
          git clone --depth 1 https://github.com/sekrit-twc/zimg.git
          cd zimg
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_zimg
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_zimg
          cd $BUILD_DIR

          # 6. x264
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          ./configure --host=aarch64-linux --enable-static --disable-cli --cross-prefix=$TOOLCHAIN/bin/aarch64-linux-android- --prefix=$BUILD_DIR/out_x264
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_x264
          cd $BUILD_DIR

          # 7. x265
          git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git
          cd x265_git/build/linux
          cmake -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -ENABLE_SHARED=OFF -DCMAKE_INSTALL_PREFIX=$BUILD_DIR/out_x265 ../../source
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_x265
          cd $BUILD_DIR

          # 8. SVT-AV1
          git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1/Build
          cmake -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=$BUILD_DIR/out_svtav1 ..
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_svtav1
          cd $BUILD_DIR

          # 9. libaom
          git clone --depth 1 https://aomedia.googlesource.com/aom
          mkdir -p aom/build_dir && cd aom/build_dir
          cmake -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=29 -DBUILD_SHARED_LIBS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DCMAKE_INSTALL_PREFIX=$BUILD_DIR/out_aom ..
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_aom
          cd $BUILD_DIR

          # 10. librav1e
          git clone --depth 1 https://github.com/xiph/rav1e.git
          cd rav1e
          cargo ndk -t arm64-v8a -p 29 -- build --release --c-header
          mkdir -p $BUILD_DIR/out_rav1e/lib $BUILD_DIR/out_rav1e/include
          cp target/aarch64-linux-android/release/librav1e.a $BUILD_DIR/out_rav1e/lib/
          cp target/aarch64-linux-android/release/rav1e.h $BUILD_DIR/out_rav1e/include/
          install_libs $BUILD_DIR/out_rav1e
          cd $BUILD_DIR

          # 11. libvpx
          git clone --depth 1 https://chromium.googlesource.com/webm/libvpx.git
          cd libvpx
          ./configure --target=arm64-android-gcc --enable-static --disable-shared --disable-examples --disable-unit-tests --prefix=$BUILD_DIR/out_vpx
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_vpx
          cd $BUILD_DIR

          # 12. LAME MP3
          git clone --depth 1 https://github.com/gypified/libmp3lame.git
          cd libmp3lame
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_lame
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_lame
          cd $BUILD_DIR

          # 13. libopus
          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_opus
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_opus
          cd $BUILD_DIR

          # 14. libvorbis
          git clone --depth 1 https://github.com/xiph/vorbis.git
          cd vorbis
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_vorbis --with-ogg=$BUILD_DIR/out_ogg
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_vorbis
          cd $BUILD_DIR

          # 15. libwebp
          git clone --depth 1 https://chromium.googlesource.com/webm/libwebp
          cd libwebp
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$BUILD_DIR/out_webp
          make -j$(nproc) && make install
          install_libs $BUILD_DIR/out_webp
          cd $BUILD_DIR

          # 16. libfdk-aac (Khusus Non-Free)
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac
          cd fdk-aac
          ./autogen.sh
          ./configure --host=aarch64-linux-android --enable-static --disable-shared --prefix=$PREFIX_NONFREE
          make -j$(nproc) && make install
          cd $BUILD_DIR

      # -------------------------------------------------------------
      # BUILD 1: FFmpeg Master - GPL Free
      # -------------------------------------------------------------
      - name: Compile FFmpeg Master - GPL Free
        run: |
          mkdir -p $BUILD_DIR/ffmpeg-gpl
          cd $BUILD_DIR/ffmpeg-gpl
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git src
          cd src

          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          export PKG_CONFIG_PATH=$PREFIX_GPL/lib/pkgconfig

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android29-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android29-clang++ \
            --ar=$TOOLCHAIN/bin/llvm-ar \
            --ranlib=$TOOLCHAIN/bin/llvm-ranlib \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --prefix=$PREFIX_GPL \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$PREFIX_GPL/include -O3 -ftree-vectorize -flto -march=armv8-a+simd" \
            --extra-ldflags="-L$PREFIX_GPL/lib -flto -Wl,--gc-sections -lpng -lz -lflac" \
            --enable-neon \
            --enable-asm \
            --enable-inline-asm \
            --enable-optimizations \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --disable-nonfree \
            --enable-mediacodec \
            --enable-jni \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libsvtav1 \
            --enable-libaom \
            --enable-librav1e \
            --enable-libvpx \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libflac \
            --enable-libwebp \
            --enable-libzimg \
            --disable-doc \
            --disable-programs \
            --enable-ffmpeg

          make -j$(nproc)
          mv ffmpeg $GITHUB_WORKSPACE/ffmpeg-android-gpl

      # -------------------------------------------------------------
      # BUILD 2: FFmpeg Master - NonFree (With libfdk-aac)
      # -------------------------------------------------------------
      - name: Compile FFmpeg Master - NonFree
        run: |
          mkdir -p $BUILD_DIR/ffmpeg-nonfree
          cd $BUILD_DIR/ffmpeg-nonfree
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git src
          cd src

          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          export PKG_CONFIG_PATH=$PREFIX_NONFREE/lib/pkgconfig

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --cc=$TOOLCHAIN/bin/aarch64-linux-android29-clang \
            --cxx=$TOOLCHAIN/bin/aarch64-linux-android29-clang++ \
            --ar=$TOOLCHAIN/bin/llvm-ar \
            --ranlib=$TOOLCHAIN/bin/llvm-ranlib \
            --strip=$TOOLCHAIN/bin/llvm-strip \
            --prefix=$PREFIX_NONFREE \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --extra-cflags="-I$PREFIX_NONFREE/include -O3 -ftree-vectorize -flto -march=armv8-a+simd" \
            --extra-ldflags="-L$PREFIX_NONFREE/lib -flto -Wl,--gc-sections -lpng -lz -lflac" \
            --enable-neon \
            --enable-asm \
            --enable-inline-asm \
            --enable-optimizations \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-nonfree \
            --enable-libfdk-aac \
            --enable-mediacodec \
            --enable-jni \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libsvtav1 \
            --enable-libaom \
            --enable-librav1e \
            --enable-libvpx \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libflac \
            --enable-libwebp \
            --enable-libzimg \
            --disable-doc \
            --disable-programs \
            --enable-ffmpeg

          make -j$(nproc)
          mv ffmpeg $GITHUB_WORKSPACE/ffmpeg-android-nonfree

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-master-complete
          path: |
            ffmpeg-android-gpl
            ffmpeg-android-nonfree
