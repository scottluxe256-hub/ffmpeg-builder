name: Build FFmpeg Modular Shared Library (.so) ARM64 Enterprise

on:
  workflow_dispatch:

jobs:
  build-android-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Enterprise Performance (RAM Disk Build Root)
        run: |
          sudo mkdir -p /dev/shm/build_space
          sudo chown -R $USER:$USER /dev/shm/build_space
          echo "WORKSPACE=/dev/shm/build_space" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            git yasm nasm texinfo cmake ninja-build wget unzip meson curl

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/android-ndk-r26b
          key: ${{ runner.os }}-ndk-r26b-v9

      - name: Download & Extract NDK if Cache Miss
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          echo "Memulai unduhan NDK r26b resmi..."
          curl -L --retry 5 --retry-delay 5 -o android-ndk-r26b-linux.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          
          if [ ! -f "android-ndk-r26b-linux.zip" ] || [ ! -s "android-ndk-r26b-linux.zip" ]; then
            echo "ERROR KRITIS: Berkas NDK gagal terunduh!"
            exit 1
          fi
          
          echo "Mengekstrak NDK..."
          unzip -q android-ndk-r26b-linux.zip
          rm -f android-ndk-r26b-linux.zip
          echo "NDK r26b Siap!"

      - name: Setup Environment Variables
        run: |
          INSTALL_DIR="$WORKSPACE/build_assets_aarch64"
          NDK="$GITHUB_WORKSPACE/android-ndk-r26b"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p "$INSTALL_DIR/lib" "$INSTALL_DIR/include" "$INSTALL_DIR/lib/pkgconfig"

          echo "NDK_PATH=$NDK" >> $GITHUB_ENV
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$INSTALL_DIR/lib/pkgconfig" >> $GITHUB_ENV
          echo "JOBS=$(nproc)" >> $GITHUB_ENV

          echo "TARGET_CLANG=$TOOLCHAIN/bin/aarch64-linux-android29-clang" >> $GITHUB_ENV
          echo "TARGET_CXX=$TOOLCHAIN/bin/aarch64-linux-android29-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV

      # 1. BUILD LIBFDK-AAC TERPISAH SEBAGAI SHARED LIBRARY (.SO)
      - name: Build Standalone Plugin libfdk_aac.so
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          ./autogen.sh
          export CC=$TARGET_CLANG
          export CXX=$TARGET_CXX
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --host=aarch64-linux-android --prefix=$INSTALL_DIR --enable-shared --disable-static --with-pic
          make -j$JOBS
          $STRIP .libs/libfdk-aac.so
          mkdir -p $GITHUB_WORKSPACE/output_binaries
          cp .libs/libfdk-aac.so $GITHUB_WORKSPACE/output_binaries/libfdk_aac.so

      - name: Build libopus (Master)
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://github.com/xiph/opus.git
          cd opus
          ./autogen.sh
          export CC=$TARGET_CLANG
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --host=aarch64-linux-android --prefix=$INSTALL_DIR --enable-static --disable-shared --with-pic
          make -j$JOBS && make install

      - name: Build x264 (Master)
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://code.videolan.org/videolan/x264.git
          cd x264
          export CC=$TARGET_CLANG
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --host=aarch64-linux-android \
            --prefix=$INSTALL_DIR --enable-static --enable-pic --disable-cli
          make -j$JOBS && make install

      - name: Build x265 (Master)
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git x265
          cmake -G "Ninja" -S x265/source -B x265/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DX265_LATEST_TAG="3.5" \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DEXPORT_C_API=ON \
            -DENABLE_ASSEMBLY=OFF
          ninja -C x265/build install

          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: x265\nDescription: H.265/HEVC video encoder\nVersion: 3.5\nLibs: -L\${libdir} -lx265 -lc++_static -lc++abi -lm\nCflags: -I\${includedir}\n" "$INSTALL_DIR" > $INSTALL_DIR/lib/pkgconfig/x265.pc

      - name: Build SVT-AV1 (Fresh Master)
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -G "Ninja" -S SVT-AV1 -B SVT-AV1/build \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_DIR \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF
          ninja -C SVT-AV1/build install

      - name: Build libvpx (Master)
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://chromium.googlesource.com/webm/libvpx.git
          cd libvpx
          export CC=$TARGET_CLANG
          export CXX=$TARGET_CXX
          export AR=$AR
          export RANLIB=$RANLIB
          ./configure --target=generic-gnu --prefix=$INSTALL_DIR \
            --enable-pic --disable-examples --disable-unit-tests --enable-vp8 --enable-vp9 \
            --disable-shared --enable-static
          make -j$JOBS && make install

      # 2. BUILD FFMPEG STATIC LGPL (TANPA NONFREE & TANPA FDK-AAC)
      - name: Build FFmpeg Static Libraries
        run: |
          cd $WORKSPACE
          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg_source
          cd ffmpeg_source

          ./configure \
            --target-os=android --arch=aarch64 --cpu=armv8-a --enable-cross-compile \
            --cc=$TARGET_CLANG \
            --cxx=$TARGET_CXX \
            --ar=$AR \
            --ranlib=$RANLIB \
            --strip=$STRIP \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --extra-cflags="-I$INSTALL_DIR/include -fPIC" \
            --extra-cxxflags="-I$INSTALL_DIR/include -fPIC" \
            --extra-ldflags="-L$INSTALL_DIR/lib" \
            --prefix=$INSTALL_DIR \
            --enable-static --disable-shared \
            --enable-gpl --disable-nonfree \
            --enable-jni --enable-mediacodec \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 --enable-libvpx --enable-libopus \
          || { echo "----- ffbuild/config.log (300 baris terakhir) -----"; tail -n 300 ffbuild/config.log; exit 1; }

          make -j$JOBS install

      # 3. BUNDLING SEMUA FILE .A MENJADI TUNGGAL LIBFFMPEG.SO (JNI SHARED)
      - name: Bundle into Single libffmpeg.so
        run: |
          echo "Menggabungkan static libraries menjadi satu libffmpeg.so..."
          
          $TARGET_CLANG -shared -o $GITHUB_WORKSPACE/output_binaries/libffmpeg.so \
            $GITHUB_WORKSPACE/jni/ffmpeg_jni.c \
            -I$INSTALL_DIR/include \
            -Wl,--whole-archive \
            $INSTALL_DIR/lib/libavformat.a \
            $INSTALL_DIR/lib/libavcodec.a \
            $INSTALL_DIR/lib/libavutil.a \
            $INSTALL_DIR/lib/libswresample.a \
            $INSTALL_DIR/lib/libx264.a \
            $INSTALL_DIR/lib/libx265.a \
            $INSTALL_DIR/lib/libSvtAv1Enc.a \
            $INSTALL_DIR/lib/libvpx.a \
            $INSTALL_DIR/lib/libopus.a \
            -Wl,--no-whole-archive \
            $INSTALL_DIR/lib/libavfilter.a \
            $INSTALL_DIR/lib/libswscale.a \
            -L$INSTALL_DIR/lib \
            -lc++_static -lc++abi -lm -ldl -lz -llog -landroid -pthread

          $STRIP $GITHUB_WORKSPACE/output_binaries/libffmpeg.so

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-and-plugins-arm64
          path: output_binaries/*
