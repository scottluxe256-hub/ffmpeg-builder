name: Build FFmpeg Master - Android ARM64 Complete

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          df -h /

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK r25c
        run: |
          sdkmanager --install "platforms;android-29" "build-tools;35.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool libtool-bin pkg-config \
            cmake ninja-build meson git curl wget unzip python3 python3-pip \
            yasm nasm texinfo gawk gettext autopoint bison flex \
            ca-certificates libssl-dev

      - name: Setup Rust for rav1e
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-c
        run: cargo install cargo-c --locked

      - name: Build all external libraries
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          SRC="$ROOT/build_space/src"
          PREFIX="$ROOT/build_space/prefix"
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          HOST="aarch64-linux-android"

          rm -rf "$ROOT/build_space"
          mkdir -p "$SRC" "$PREFIX/include" "$PREFIX/lib/pkgconfig" "$PREFIX/bin"

          export PATH="$TOOLCHAIN/bin:$PREFIX/bin:$HOME/.cargo/bin:$PATH"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android29-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android29-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export NM="$TOOLCHAIN/bin/llvm-nm"
          export LD="$TOOLCHAIN/bin/ld.lld"

          export CFLAGS="-O3 -fPIC -march=armv8-a+simd -D__ANDROID_API__=29"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$PREFIX/lib -Wl,--gc-sections"
          export CPPFLAGS="-I$PREFIX/include"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          clone() {
            git clone --depth 1 "$1" "$2"
          }

          autoreconf_build() {
            local dir="$1"
            local prefix="$2"

            cd "$dir"

            autoreconf -fi

            ./configure \
              --host="$HOST" \
              --prefix="$prefix" \
              --enable-static \
              --disable-shared \
              --disable-dependency-tracking \
              CPPFLAGS="$CPPFLAGS" \
              CFLAGS="$CFLAGS" \
              LDFLAGS="$LDFLAGS"

            make -j"$(nproc)"
            make install
          }

          cd "$SRC"

          echo '=== zlib ==='
          clone https://github.com/madler/zlib.git zlib
          cd zlib

          CC="$CC" CFLAGS="$CFLAGS" ./configure \
            --static \
            --prefix="$PREFIX"

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== libogg ==='
          clone https://github.com/xiph/ogg.git ogg
          autoreconf_build "$SRC/ogg" "$PREFIX"

          echo '=== libflac ==='
          clone https://github.com/xiph/flac.git flac
          cd flac

          autoreconf -fi

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-dependency-tracking \
            --with-ogg="$PREFIX" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== libpng (NEON) ==='
          clone https://github.com/pnggroup/libpng.git libpng
          cd libpng

          autoreconf -fi

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            --enable-arm-neon=on \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== zimg ==='
          clone https://github.com/sekrit-twc/zimg.git zimg
          autoreconf_build "$SRC/zimg" "$PREFIX"

          echo '=== x264 ==='
          clone https://code.videolan.org/videolan/x264.git x264
          cd x264

          ./configure \
            --host="$HOST" \
            --cross-prefix="$TOOLCHAIN/bin/aarch64-linux-android-" \
            --sysroot="$SYSROOT" \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-cli \
            --enable-pic

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== x265 ==='
          clone https://bitbucket.org/multicoreware/x265_git.git x265

          cmake -S x265/source -B x265/build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"

          cmake --build x265/build --parallel "$(nproc)"
          cmake --install x265/build

          echo '=== SVT-AV1 ==='
          clone https://gitlab.com/AOMediaCodec/SVT-AV1.git svt-av1

          cmake -S svt-av1 -B svt-av1/build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"

          cmake --build svt-av1/build --parallel "$(nproc)"
          cmake --install svt-av1/build

          echo '=== libaom ==='
          clone https://aomedia.googlesource.com/aom aom

          cmake -S aom -B aom/build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DENABLE_EXAMPLES=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PREFIX"

          cmake --build aom/build --parallel "$(nproc)"
          cmake --install aom/build

          echo '=== libvpx ==='
          clone https://chromium.googlesource.com/webm/libvpx.git libvpx
          cd libvpx

          ./configure \
            --target=arm64-android-gcc \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-examples \
            --disable-tools \
            --disable-unit-tests \
            --enable-pic

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== lame ==='
          clone https://github.com/lameproject/lame.git lame
          autoreconf_build "$SRC/lame" "$PREFIX"

          echo '=== opus ==='
          clone https://github.com/xiph/opus.git opus
          autoreconf_build "$SRC/opus" "$PREFIX"

          echo '=== vorbis ==='
          clone https://github.com/xiph/vorbis.git vorbis
          cd vorbis

          autoreconf -fi

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-dependency-tracking \
            --with-ogg="$PREFIX" \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== webp ==='
          clone https://chromium.googlesource.com/webm/libwebp.git libwebp
          autoreconf_build "$SRC/libwebp" "$PREFIX"

          echo '=== dav1d (AV1 decoder, ARM64 asm/NEON) ==='
          clone https://code.videolan.org/videolan/dav1d.git dav1d

          meson setup dav1d/build dav1d \
            --cross-file=dav1d/package/crossfiles/aarch64-android.meson \
            --default-library=static \
            --buildtype=release \
            --prefix="$PREFIX" \
            --libdir=lib \
            -Denable_tools=false \
            -Denable_tests=false

          meson compile -C dav1d/build -j "$(nproc)"
          meson install -C dav1d/build

          echo '=== rav1e (AV1 encoder C API, ARM64 asm/NEON) ==='
          clone https://github.com/xiph/rav1e.git rav1e
          cd rav1e

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
          export CC_aarch64_linux_android="$CC"
          export CXX_aarch64_linux_android="$CXX"
          export AR_aarch64_linux_android="$AR"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C target-feature=+neon -C target-cpu=generic"

          cargo cinstall \
            --release \
            --target aarch64-linux-android \
            --prefix "$PREFIX" \
            --library-type staticlib \
            --locked

          cd "$SRC"

          echo '=== fdk-aac (nonfree) ==='
          clone https://github.com/mstorsjo/fdk-aac.git fdk-aac
          cd fdk-aac

          autoreconf -fi

          ./configure \
            --host="$HOST" \
            --prefix="$PREFIX" \
            --enable-static \
            --disable-shared \
            --disable-dependency-tracking \
            CPPFLAGS="$CPPFLAGS" \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS"

          make -j"$(nproc)"
          make install

          cd "$SRC"

          echo '=== verify pkg-config libraries ==='

          pkg-config --modversion x264
          pkg-config --modversion x265 || true
          pkg-config --modversion libaom
          pkg-config --modversion SvtAv1Enc
          pkg-config --modversion vpx
          pkg-config --modversion opus
          pkg-config --modversion vorbis
          pkg-config --modversion flac
          pkg-config --modversion dav1d
          pkg-config --modversion rav1e
          pkg-config --modversion fdk-aac

          test -f "$PREFIX/include/png.h"
          test -f "$PREFIX/lib/libpng16.a"
          test -f "$PREFIX/lib/libdav1d.a"
          test -f "$PREFIX/lib/librav1e.a"

          echo '=== PREFIX ==='
          find "$PREFIX" -maxdepth 2 -type f | sort | head -200

      - name: Build FFmpeg master
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          PREFIX="$ROOT/build_space/prefix"
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          export PATH="$TOOLCHAIN/bin:$PREFIX/bin:$HOME/.cargo/bin:$PATH"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"

          export CC="$TOOLCHAIN/bin/aarch64-linux-android29-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android29-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export NM="$TOOLCHAIN/bin/llvm-nm"

          cd "$ROOT/build_space"

          git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg
          cd ffmpeg

          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --sysroot="$TOOLCHAIN/sysroot" \
            --cc="$CC" \
            --cxx="$CXX" \
            --ar="$AR" \
            --ranlib="$RANLIB" \
            --strip="$STRIP" \
            --nm="$NM" \
            --pkg-config=pkg-config \
            --pkg-config-flags=--static \
            --prefix="$ROOT/out/ffmpeg-android-arm64" \
            --extra-cflags="-I$PREFIX/include -O3 -fPIC -march=armv8-a+simd -D__ANDROID_API__=29" \
            --extra-ldflags="-L$PREFIX/lib -Wl,--gc-sections" \
            --extra-libs="-lm -ldl" \
            --enable-neon \
            --enable-asm \
            --enable-inline-asm \
            --enable-pic \
            --enable-pthreads \
            --enable-static \
            --disable-shared \
            --enable-gpl \
            --enable-nonfree \
            --enable-mediacodec \
            --enable-jni \
            --enable-zlib \
            --enable-libpng \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libsvtav1 \
            --enable-libaom \
            --enable-libvpx \
            --enable-librav1e \
            --enable-libdav1d \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-libflac \
            --enable-libwebp \
            --enable-libzimg \
            --enable-libfdk-aac \
            --disable-doc \
            --disable-debug

          make -j"$(nproc)"
          make install

          "$ROOT/out/ffmpeg-android-arm64/bin/ffmpeg" -version
          "$ROOT/out/ffmpeg-android-arm64/bin/ffmpeg" -buildconf

          file "$ROOT/out/ffmpeg-android-arm64/bin/ffmpeg"

          "$ROOT/out/ffmpeg-android-arm64/bin/ffmpeg" \
            -hide_banner -encoders |
            grep -E 'libx264|libx265|libsvtav1|libaom|librav1e|png|libvpx|libopus|libvorbis|libfdk' || true

          "$ROOT/out/ffmpeg-android-arm64/bin/ffmpeg" \
            -hide_banner -decoders |
            grep -E 'libdav1d|libvpx|libopus|libvorbis|png' || true

          "$ROOT/out/ffmpeg-android-arm64/bin/ffmpeg" \
            -hide_banner -formats >/dev/null

      - name: Package artifact
        run: |
          cd "$GITHUB_WORKSPACE/out"
          tar -czf ffmpeg-android-arm64-complete.tar.gz ffmpeg-android-arm64
          sha256sum ffmpeg-android-arm64-complete.tar.gz

      - name: Upload FFmpeg Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64-complete
          path: ${{ github.workspace }}/out/ffmpeg-android-arm64-complete.tar.gz
          if-no-files-found: error
```
