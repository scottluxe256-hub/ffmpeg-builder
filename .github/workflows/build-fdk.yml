name: Build fdk-aac CLI (static, Android arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/build-fdk.yml'

env:
  NDK_VERSION: r27c
  API_LEVEL: 24
  TARGET: aarch64-linux-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool build-essential curl pkg-config nasm

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Export toolchain paths
        run: |
          echo "TOOLCHAIN=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"
          echo "FDK_PREFIX=${{ github.workspace }}/install/fdk-aac" >> "$GITHUB_ENV"
          echo "FFMPEG_PREFIX=${{ github.workspace }}/install/ffmpeg" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 1) libfdk-aac static (encoder AAC) — versi terbaru dari repo resmi
      # ---------------------------------------------------------------
      - name: Build libfdk-aac (static, arm64-v8a)
        run: |
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git
          cd fdk-aac
          autoreconf -fiv
          CC="$TOOLCHAIN/bin/${TARGET}${API_LEVEL}-clang" \
          CXX="$TOOLCHAIN/bin/${TARGET}${API_LEVEL}-clang++" \
          AR="$TOOLCHAIN/bin/llvm-ar" \
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib" \
          STRIP="$TOOLCHAIN/bin/llvm-strip" \
          ./configure \
            --host=aarch64-linux-android \
            --enable-static --disable-shared \
            --prefix="$FDK_PREFIX"
          make -j"$(nproc)"
          make install

      # ---------------------------------------------------------------
      # 2) libavformat + libavcodec + libavutil + libswresample static
      #    (CUMA demux+decode, semua encoder/muxer/network/avdevice/avfilter
      #    dimatikan — ini dipakai sebagai LIBRARY yang di-link langsung ke
      #    binary fdk-aac, bukan dipanggil sebagai proses ffmpeg terpisah)
      # ---------------------------------------------------------------
      - name: Build FFmpeg libav* decode-only (static, arm64-v8a)
        run: |
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
          cd ffmpeg-src
          ./configure \
            --target-os=android \
            --arch=aarch64 \
            --cpu=armv8-a \
            --enable-cross-compile \
            --cross-prefix="$TOOLCHAIN/bin/llvm-" \
            --cc="$TOOLCHAIN/bin/${TARGET}${API_LEVEL}-clang" \
            --cxx="$TOOLCHAIN/bin/${TARGET}${API_LEVEL}-clang++" \
            --sysroot="$TOOLCHAIN/sysroot" \
            --enable-static --disable-shared \
            --disable-programs --disable-doc \
            --disable-avdevice --disable-avfilter --disable-postproc \
            --disable-network \
            --disable-encoders --disable-muxers \
            --disable-zlib --disable-lzma --disable-bzlib --disable-iconv \
            --disable-debug \
            --extra-cflags="-O2" \
            --prefix="$FFMPEG_PREFIX"
          # Catatan: kalau ./configure gagal deteksi cross-compile toolchain,
          # coba tambahkan --disable-asm sebagai fallback (lebih lambat tapi
          # lebih gampang link-nya). Demuxer/decoder tetap "enable semua"
          # secara default (tidak dibatasi format tertentu) sesuai kebutuhan
          # "semua format apapun".
          make -j"$(nproc)"
          make install

      # ---------------------------------------------------------------
      # 3) minimp4.h — muxer MP4 output .m4a (single header, MIT)
      # ---------------------------------------------------------------
      - name: Fetch minimp4.h
        run: curl -fsSL -o src/minimp4.h https://raw.githubusercontent.com/lieff/minimp4/master/minimp4.h

      # ---------------------------------------------------------------
      # 4) compile fdk-aac CLI, link semua static jadi satu binary
      # ---------------------------------------------------------------
      - name: Build fdk-aac CLI (fully static executable)
        run: |
          "$TOOLCHAIN/bin/${TARGET}${API_LEVEL}-clang" \
            -O2 -static -o fdk-aac \
            src/main.c \
            -I"$FDK_PREFIX/include" \
            -I"$FFMPEG_PREFIX/include" \
            -Isrc \
            -Wl,--start-group \
            "$FFMPEG_PREFIX/lib/libavformat.a" \
            "$FFMPEG_PREFIX/lib/libavcodec.a" \
            "$FFMPEG_PREFIX/lib/libswresample.a" \
            "$FFMPEG_PREFIX/lib/libavutil.a" \
            "$FDK_PREFIX/lib/libfdk-aac.a" \
            -Wl,--end-group \
            -lm
          # Kalau -static gagal link penuh di NDK versi kamu, cek dulu log
          # build libfdk-aac/x264/x265/svtav1 di proyek ffmpeg-scott kamu
          # yang sudah lebih dulu berhasil static build — biasanya isunya
          # sama (versi NDK / API level / flag linker).
          "$TOOLCHAIN/bin/llvm-strip" fdk-aac

      - name: Siapkan versi .so (workaround Access Denied di Android)
        run: cp fdk-aac libfdk-aac-cli.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdk-aac-android-arm64
          path: |
            fdk-aac
            libfdk-aac-cli.so
