name: Build FDK-AAC Standalone Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nsetup/setup-android-ndk@v1.0.0
        with:
          ndk-version: 'r25c'

      - name: Cache Build Dependencies
        uses: actions/cache@v3
        with:
          path: |
            build_deps
          key: fdk-deps-arm64-v4-${{ hashFiles('**/build-fdk.yml') }}

      - name: Build fdk-aac & FFmpeg Libraries (Static)
        run: |
          set -e
          export NDK=$ANDROID_NDK_ROOT
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/$HOST_TAG
          export TARGET=aarch64-linux-android
          export API=24
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip

          PREFIX="$(pwd)/build_deps"
          mkdir -p "$PREFIX"

          # 1. Build libfdk-aac jika belum ada di cache
          if [ ! -f "$PREFIX/lib/libfdk-aac.a" ]; then
            echo "Building libfdk-aac..."
            git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git
            cd fdk-aac
            ./autogen.sh
            ./configure \
              --host=$TARGET \
              --prefix=$PREFIX \
              --enable-static \
              --disable-shared \
              CC=$CC CXX=$CXX AR=$AR RANLIB=$RANLIB STRIP=$STRIP
            make -j$(nproc)
            make install
            cd ..
          fi

          # 2. Build Minimal FFmpeg Libraries
          if [ ! -f "$PREFIX/lib/libavcodec.a" ]; then
            echo "Building minimal FFmpeg libraries..."
            git clone --depth 1 https://git.ffmpeg.org/ffmpeg.git ffmpeg_src
            cd ffmpeg_src
            
            ./configure \
              --target-os=android \
              --arch=aarch64 \
              --cpu=armv8-a \
              --enable-cross-compile \
              --cc=$CC \
              --cxx=$CXX \
              --ar=$AR \
              --ranlib=$RANLIB \
              --strip=$STRIP \
              --prefix=$PREFIX \
              --enable-static \
              --disable-shared \
              --enable-pic \
              --disable-everything \
              --disable-programs \
              --disable-doc \
              --enable-decoder=aac,mp3,flac,pcm_s16le,pcm_s24le,wav \
              --enable-demuxer=aac,mp3,flac,wav,mov,matroska,avi \
              --enable-muxer=mp4,m4a,ipod,adts \
              --enable-protocol=file \
              --enable-parser=aac,mpegaudio \
              --enable-filter=aresample \
              --enable-libfdk-aac \
              --enable-nonfree \
              --extra-cflags="-I$PREFIX/include" \
              --extra-ldflags="-L$PREFIX/lib"
            
            make -j$(nproc)
            make install
            cd ..
          fi

      - name: Compile Standalone Executable (main.c)
        run: |
          export NDK=$ANDROID_NDK_ROOT
          export HOST_TAG=linux-x86_64
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/$HOST_TAG
          export TARGET=aarch64-linux-android
          export API=24
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          PREFIX="$(pwd)/build_deps"

          mkdir -p output

          echo "Compiling fdk-aac binary with full M4A/MP4 muxing support..."
          $CC main.c -o output/fdk-aac \
            -I$PREFIX/include \
            -L$PREFIX/lib \
            -lavformat -lavcodec -lswresample -lavutil -lfdk-aac -lm -lz -ldl \
            -static-libstdc++ \
            -O3 -s

          chmod +x output/fdk-aac

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdk-aac-android-arm64
          path: output/fdk-aac
