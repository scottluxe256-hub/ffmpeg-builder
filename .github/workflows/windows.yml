name: Build FFmpeg Static Windows x64

on:
  workflow_dispatch:

jobs:
  build-windows-static:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            git yasm nasm texinfo cmake ninja-build wget unzip python3 binutils \
            mingw-w64 p7zip-full

      - name: Setup Environment
        run: |
          INSTALL_DIR="$GITHUB_WORKSPACE/build_assets"
          mkdir -p "$INSTALL_DIR"

          echo "INSTALL_DIR=$INSTALL_DIR" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$INSTALL_DIR/lib/pkgconfig:$INSTALL_DIR/lib64/pkgconfig" >> $GITHUB_ENV

      # --- BUILD LIBRARIES ---

      - name: Build External Libraries
        run: |
          set -euxo pipefail
          SRC="$GITHUB_WORKSPACE/build_sources"
          PREFIX="$INSTALL_DIR"
          HOST="x86_64-w64-mingw32"

          mkdir -p "$SRC" "$PREFIX/lib/pkgconfig" "$PREFIX/include"

          export CC=$HOST-gcc
          export CXX=$HOST-g++
          export AR=$HOST-ar
          export RANLIB=$HOST-ranlib
          export CFLAGS="-O3 -static-libgcc -static-libstdc++"
          export CXXFLAGS="$CFLAGS"

          clone() { git clone --depth 1 "$1" "$2"; }

          # 1. zlib (Aman untuk Windows)
          clone https://github.com/madler/zlib.git "$SRC/zlib"
          cd "$SRC/zlib"
          make -f win32/Makefile.gcc PREFIX=$HOST- BINARY_PATH=$PREFIX/bin INCLUDE_PATH=$PREFIX/include LIBRARY_PATH=$PREFIX/lib install

          # 2. ogg
          clone https://github.com/xiph/ogg.git "$SRC/ogg"
          cd "$SRC/ogg" && ./autogen.sh
          ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared
          make -j$(nproc) && make install

          # 3. x264
          clone https://code.videolan.org/videolan/x264.git "$SRC/x264"
          cd "$SRC/x264"
          ./configure --host="$HOST" --cross-prefix=$HOST- --prefix="$PREFIX" --enable-static --disable-cli
          make -j$(nproc) && make install

          # 4. x265 (Full clone & Fix Git Version Error)
          git clone https://github.com/videolan/x265.git "$SRC/x265"
          cmake -G "Ninja" -S "$SRC/x265/source" -B "$SRC/x265/build" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=$HOST-gcc \
            -DCMAKE_CXX_COMPILER=$HOST-g++ \
            -DCMAKE_RC_COMPILER=$HOST-windres \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_SHARED=OFF -DENABLE_CLI=OFF -DEXPORT_C_API=ON
          ninja -C "$SRC/x265/build" install
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: x265\nDescription: H.265/HEVC video encoder\nVersion: 3.5\nLibs: -L\${libdir} -lx265 -lstdc++ -lgcc -lwinmm\nCflags: -I\${includedir}\n" "$PREFIX" > "$PREFIX/lib/pkgconfig/x265.pc"

          # 5. SVT-AV1
          clone https://gitlab.com/AOMediaCodec/SVT-AV1.git "$SRC/SVT-AV1"
          cmake -G "Ninja" -S "$SRC/SVT-AV1" -B "$SRC/SVT-AV1/build" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=$HOST-gcc \
            -DCMAKE_CXX_COMPILER=$HOST-g++ \
            -DCMAKE_RC_COMPILER=$HOST-windres \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_APPS=OFF
          ninja -C "$SRC/SVT-AV1/build" install

          # 6. libaom
          clone https://aomedia.googlesource.com/aom "$SRC/aom"
          cmake -G "Ninja" -S "$SRC/aom" -B "$SRC/aom/build" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=$HOST-gcc \
            -DCMAKE_CXX_COMPILER=$HOST-g++ \
            -DCMAKE_RC_COMPILER=$HOST-windres \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR=lib \
            -DENABLE_TESTS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TOOLS=OFF
          ninja -C "$SRC/aom/build" install
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: aom\nDescription: AV1 Video Codec Library\nVersion: 3.8.0\nLibs: -L\${libdir} -laom -lstdc++ -lgcc\nCflags: -I\${includedir}\n" "$PREFIX" > "$PREFIX/lib/pkgconfig/aom.pc"

          # 7. libvpx (Build via ./configure bawaan vpx)
          clone https://chromium.googlesource.com/webm/libvpx.git "$SRC/libvpx"
          mkdir -p "$SRC/libvpx-build" && cd "$SRC/libvpx-build"
          ../libvpx/configure \
            --target=x86_64-win64-gcc \
            --prefix="$PREFIX" \
            --libdir="$PREFIX/lib" \
            --as=nasm \
            --disable-shared \
            --enable-static \
            --disable-examples \
            --disable-unit-tests \
            --enable-vp8 \
            --enable-vp9 \
            --enable-postproc \
            --enable-vp9-postproc \
            --enable-multithread \
            --enable-pic
          make -j$(nproc)
          make install

          # 8. mp3lame
          clone https://github.com/lameproject/lame.git "$SRC/lame"
          cd "$SRC/lame" && ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared --disable-frontend
          make -j$(nproc) && make install

          # 9. opus
          clone https://github.com/xiph/opus.git "$SRC/opus"
          cd "$SRC/opus" && ./autogen.sh && ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared
          make -j$(nproc) && make install

          # 10. vorbis
          clone https://github.com/xiph/vorbis.git "$SRC/vorbis"
          cd "$SRC/vorbis" && ./autogen.sh && ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared OGG_CFLAGS="-I$PREFIX/include" OGG_LIBS="-L$PREFIX/lib -logg"
          make -j$(nproc) && make install

          # 11. libwebp
          clone https://chromium.googlesource.com/webm/libwebp.git "$SRC/libwebp"
          cd "$SRC/libwebp" && ./autogen.sh && ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared
          make -j$(nproc) && make install
          printf "prefix=%s\nexec_prefix=\${prefix}\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: libwebp\nDescription: WebP image codec\nVersion: 1.3.2\nLibs: -L\${libdir} -lwebp -lsharpyuv -lstdc++ -lgcc\nCflags: -I\${includedir}\n" "$PREFIX" > "$PREFIX/lib/pkgconfig/libwebp.pc"

          # 12. fdk-aac
          clone https://github.com/mstorsjo/fdk-aac.git "$SRC/fdk-aac"
          cd "$SRC/fdk-aac" && ./autogen.sh && ./configure --host="$HOST" --prefix="$PREFIX" --enable-static --disable-shared
          make -j$(nproc) && make install

          # 13. nv-codec-headers (Wajib untuk NVIDIA NVENC/NVDEC)
          clone https://git.videolan.org/git/ffmpeg/nv-codec-headers.git "$SRC/nv-codec-headers"
          cd "$SRC/nv-codec-headers"
          make PREFIX="$PREFIX" install
          
      # --- FFMPEG ---

      - name: Build FFmpeg
        run: |
          mkdir ffmpeg_source && cd ffmpeg_source
          git init -q
          git remote add origin https://github.com/FFmpeg/FFmpeg.git
          git fetch --depth 1 origin master
          git checkout -q FETCH_HEAD

          ./configure \
            --target-os=mingw32 --arch=x86_64 --cpu=sandybridge --enable-cross-compile \
            --cross-prefix=x86_64-w64-mingw32- \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --extra-cflags="-I$INSTALL_DIR/include" \
            --extra-cxxflags="-I$INSTALL_DIR/include" \
            --extra-ldflags="-L$INSTALL_DIR/lib -L$INSTALL_DIR/lib64 -static -static-libgcc -static-libstdc++" \
            --extra-libs="-lpthread -lwinmm -lws2_32 -lole32 -luuid" \
            --prefix=$INSTALL_DIR \
            --enable-static --disable-shared \
            --enable-x86asm --enable-inline-asm \
            --enable-gpl --enable-nonfree \
            --enable-dxva2 --enable-d3d11va \
            --enable-nvenc --enable-nvdec \
            --enable-amf \
            --enable-libx264 --enable-libx265 --enable-libsvtav1 \
            --enable-libaom --enable-libvpx --enable-libmp3lame --enable-libopus \
            --enable-libvorbis --enable-libwebp --enable-libfdk-aac \
          || { echo "----- ffbuild/config.log (300 baris terakhir) -----"; tail -n 300 ffbuild/config.log; exit 1; }

          make -j$(nproc)
          x86_64-w64-mingw32-strip ffmpeg.exe

          # Kompresi 7z Super Kecil (Ultra Compression)
          7z a -t7z -m0=lzma2 -mx=9 -mfb=64 -md=32m -ms=on ffmpeg_win64_ultra.7z ffmpeg.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows-x64-ultra
          path: ffmpeg_source/ffmpeg_win64_ultra.7z
          compression-level: 0
